[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peexcel"
version = "0.0.0"
description = "PE-Excel tooling"
requires-python = ">=3.10"
dependencies = [
  "pandas",
]

[project.optional-dependencies]
batch = [
  "pywin32; sys_platform == 'win32'",
  "openpyxl",
]
publication = [
  "matplotlib",
  "plotly>=6.1.1,<7",
  "kaleido>=1,<2",
  "openpyxl",
  "nbformat",
  "nbclient",
  "nbconvert>=7,<8",
  "PyYAML>=6,<7",
  "ipykernel",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pexl = "pexl.cli:main"

[tool.setuptools.package-data]
"pexl.spatial" = ["data/*.json"]
