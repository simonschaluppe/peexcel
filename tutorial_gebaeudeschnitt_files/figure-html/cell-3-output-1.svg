<svg xmlns="http://www.w3.org/2000/svg" viewBox="99.5 145 3951.21 141.543" width="3951.21" height="141.543" data-style="teaching" data-palette="default" data-annotations="false" role="img" aria-label="Schematischer Gebäudeschnitt; neutrale Lehrdarstellung"><title>Beispiel | Alle Energiesysteme — schematic section</title><desc>Independent horizontal and vertical scales; fixed schematic construction and insulation layers. Missing building_count: assumed 1. Missing storey_count_avg: assumed 1. A common section depth of 15 m is assumed. NFA-based widths, uniform room heights, flat roofs and building gaps are schematic. After ground-floor retail, each school and office usage forms one block in the least occupied building. Other tops up each block's last floor, followed by residential from its remaining area budget. No unassigned schematic spaces are added. After filling buffer gaps, remaining residential fills the lowest building tops first, sharing height differences evenly where possible. Continuous blocks take priority over equal heights. Building count and usage areas are preserved; footprints and occupied storey counts may differ from the supplied average. Gaps between schematic floor footprints [m]: []. Facade relief has drawing thickness only. PV area placement uses flat schematic roof capacity with no setback; butterfly module symbols show 15 degree tilt. Tilt does not alter the schematic area budget or establish actual suitability.</desc><defs><linearGradient id="section-sheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f8f4"/></linearGradient><linearGradient id="section-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f0f1"/><stop offset="1" stop-color="#fffefa"/></linearGradient><linearGradient id="section-soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7e4d9"/><stop offset="1" stop-color="#c9cbbd"/></linearGradient></defs><rect id="b0:f0:s0" x="140.0" y="187.77167016809477" width="850.688" height="56.0" fill="#edf1f3" stroke="white" stroke-width="1" data-semantic-id="space:b0:f0:office:0"><title>NGF Büro: 3190.08 m²</title></rect><rect id="b0:f0:s1" x="990.688" y="187.77167016809477" width="3019.52" height="56.0" fill="#edf1f3" stroke="white" stroke-width="1" data-semantic-id="space:b0:f0:residential:0"><title>NGF Wohnen: 11323.2 m²</title></rect><rect id="slab:b0:f0" data-kind="slab" x="136.0" y="243.77167016809477" width="3878.208" height="7.7716701680947775" fill="#697983" data-semantic-id="floor:b0:f0"/><rect id="b0:f0:left" x="136.0" y="187.77167016809477" width="4.0" height="56.0" fill="#697983" data-kind="facade" aria-label="Façade construction — schematic thickness" data-semantic-id="facade:b0:f0:left"><title>Façade construction — schematic thickness</title></rect><rect id="b0:f0:right" x="4010.208" y="187.77167016809477" width="4.0" height="56.0" fill="#697983" data-kind="facade" aria-label="Façade construction — schematic thickness" data-semantic-id="facade:b0:f0:right"><title>Façade construction — schematic thickness</title></rect><rect id="window:b0:f0:left" data-kind="window" data-glazing-ratio="0.3996301623176495" x="134.5" y="204.5820256232006" width="4.5" height="22.37928908978837" fill="#d5edf1" stroke="#40869b" stroke-width="0.8" data-semantic-id="facade:b0:f0:left"><title>Street facade: 40% glazing; equivalent opening</title></rect><rect id="window:b0:f0:right" data-kind="window" data-glazing-ratio="0.3996301623176495" x="4011.208" y="204.5820256232006" width="4.5" height="22.37928908978837" fill="#d5edf1" stroke="#40869b" stroke-width="0.8" data-semantic-id="facade:b0:f0:right"><title>Courtyard facade: 40% glazing; equivalent opening</title></rect><rect id="r0" x="136.0" y="180.0" width="858.688" height="7.7716701680947775" fill="#697983" data-kind="roof" aria-label="Roof construction — schematic thickness" data-semantic-id="roof:space:b0:f0:office:0:0"><title>Roof construction — schematic thickness</title></rect><rect id="r1" x="986.688" y="180.0" width="3027.52" height="7.7716701680947775" fill="#697983" data-kind="roof" aria-label="Roof construction — schematic thickness" data-semantic-id="roof:space:b0:f0:residential:0:0"><title>Roof construction — schematic thickness</title></rect></svg>