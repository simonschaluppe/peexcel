<svg xmlns="http://www.w3.org/2000/svg" viewBox="99.5 145 441 298.8" width="441" height="298.8" data-style="teaching" data-palette="default" data-annotations="false" role="img" aria-label="Schematischer Gebäudeschnitt; neutrale Lehrdarstellung"><title>Referenzmodell: zwei beheizte Geschosse, unbeheizter Keller — schematic section</title><desc>Independent horizontal and vertical scales; fixed schematic construction and insulation layers. Unknown areas: NFA_office, NFA_schoolsec, NFA_schoolprim, NFA_retailfood, NFA_retailother. Missing rh_avg: assumed 3.0. Missing rh_ceiling: assumed 0.35. Depth is specified per building, defaulting to 15 m. NFA-based widths, uniform room heights, flat roofs and building gaps are schematic. Missing fenestration inputs: 30% glazing assumed for above-ground facades; buried basement walls remain opaque. Basements fill B1 downwards in basement_usages order. Retail, schools, then other are eligible by default; office and residential require explicit basement_usages. Unfilled basement footprint remains empty and is excluded from NFA. Below-only usage capacity is reserved before shared usages; no area is discarded. Building count, usage order, relative lengths and floor limits come from the custom layout, overriding scenario count and average storeys for this projection. Explicit shares apply to each scenario usage total; remaining area is split by relative length times depth times eligible above-ground and basement floor capacity among unspecified buildings. Total building length is the smallest fitting the allocated areas at the supplied length ratios and floor limits. Gaps are excluded; the final above-ground floor may be partial, while basement floors retain their footprint with any unfilled area shown empty. HVAC and roof systems are symbolic overlays: scenario hints are overridden by shared then per-building presentation settings. They do not change scenario inputs, areas, roof capacity or energy calculations. Gaps between schematic floor footprints [m]: []. Facade relief has drawing thickness only. PV area placement uses flat schematic roof capacity with no setback; butterfly module symbols show 15 degree tilt. Tilt does not alter the schematic area budget or establish actual suitability.</desc><defs><linearGradient id="section-sheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#f8f8f4" /></linearGradient><linearGradient id="section-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f0f1" /><stop offset="1" stop-color="#fffefa" /></linearGradient><linearGradient id="section-soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7e4d9" /><stop offset="1" stop-color="#c9cbbd" /></linearGradient></defs><rect id="A:f-1:s0" x="140.0" y="335.09999999999997" width="360.0" height="66.0" fill="#e5e1d9" stroke="white" stroke-width="1" data-semantic-id="space:A:f-1:other:0"><title>NGF Sonstige: 300 m²</title></rect><rect id="A:f0:s1" x="140.0" y="261.4" width="360.0" height="66.0" fill="#edf1f3" stroke="white" stroke-width="1" data-semantic-id="space:A:f0:residential:0"><title>NGF Wohnen: 300 m²</title></rect><rect id="A:f1:s2" x="140.0" y="187.7" width="360.0" height="66.0" fill="#edf1f3" stroke="white" stroke-width="1" data-semantic-id="space:A:f1:residential:0"><title>NGF Wohnen: 300 m²</title></rect><rect id="slab:A:f-1" data-kind="slab" x="136.0" y="401.09999999999997" width="368.0" height="7.699999999999999" fill="#697983" data-semantic-id="floor:A:f-1" data-category="COMP_name_basement_floor_unheated" tabindex="0" role="button" aria-label="Erdb. Fußboden unbeheizt" /><rect id="slab:A:f0" data-kind="slab" x="136.0" y="327.4" width="368.0" height="7.699999999999999" fill="#697983" data-semantic-id="floor:A:f0" data-category="COMP_name_basement_ceiling" tabindex="0" role="button" aria-label="Kellerdecke" /><rect id="slab:A:f1" data-kind="slab" x="136.0" y="253.7" width="368.0" height="7.699999999999999" fill="#697983" data-semantic-id="floor:A:f1" data-category="COMP_name_ceiling" tabindex="0" role="button" aria-label="Geschossdecke" /><rect id="A:f-1:left" x="136.0" y="335.09999999999997" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Erdb. Wand Keller" data-semantic-id="facade:A:f-1:left" data-category="COMP_name_wall_ec_unheated" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="A:f-1:right" x="500.0" y="335.09999999999997" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Erdb. Wand Keller" data-semantic-id="facade:A:f-1:right" data-category="COMP_name_wall_ec_unheated" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="A:f0:left" x="136.0" y="261.4" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Außenwand" data-semantic-id="facade:A:f0:left" data-category="COMP_name_wall" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="A:f0:right" x="500.0" y="261.4" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Außenwand" data-semantic-id="facade:A:f0:right" data-category="COMP_name_wall" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="A:f1:left" x="136.0" y="187.7" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Außenwand" data-semantic-id="facade:A:f1:left" data-category="COMP_name_wall" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="A:f1:right" x="500.0" y="187.7" width="4.0" height="66.0" fill="#697983" data-kind="facade" aria-label="Außenwand" data-semantic-id="facade:A:f1:right" data-category="COMP_name_wall" tabindex="0" role="button"><title>Façade construction — schematic thickness</title></rect><rect id="window:A:f0:left" data-kind="window" data-glazing-ratio="0.3" x="134.5" y="284.5" width="4.5" height="19.79999999999