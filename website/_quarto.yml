project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "assessment.ipynb"
    - "!en/**"
  # pre-render:
  #   - python ../scripts/website_assets.py
  #   - python ../scripts/publication_example.py --output assets
  # post-render:
  #   - python ../scripts/render_english_site.py
  resources:
    - assets/**
    - media/**
    - downloads/**
    - tutorials/**
website:
  title: PEExcel
  description: Quartiere modellieren und den klimaaktiv Plus-Energie-Standard anwenden.
  search: true
  navbar:
    logo: media/logo.png
    logo-alt: "PEExcel Logo"
    left:
      - {href: excel-overview.qmd, text: Starten}
      - {href: model.qmd, text: Modellieren}
      - {href: results.qmd, text: Analysieren}
      - {href: projekte-nachweisen.qmd, text: Deklarieren}
      - {href: research.qmd, text: Dokumentation}
      - {href: assessment-explained.qmd, text: Quick-Check}
    right:
      - {href: download.qmd, text: Download, icon: download}
      - {href: en/index.html, text: English}
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: "Starten"
        contents:
          - text: "Erste Schritte"
            href: excel-overview.qmd
          - text: "Download und Voraussetzungen"
            href: download.qmd
          - text: "Orientierung im Excel-Tool"
            href: excel-navigation.qmd
          - text: "Schnellauswahl mit Presets"
            href: presets.qmd
      - section: Modellieren
        contents: [model.qmd, envelope.qmd, components.qmd, hvac.qmd, pv.qmd, systems.qmd, usage.qmd, interfaces.qmd, mobility.qmd, climate.qmd, variants.qmd, migration.qmd]
      - section: Analysieren
        contents: [results.qmd, excel-dashboard.qmd, comparison.qmd, batch.qmd, examples.qmd, assessment-explained.qmd, assessment.ipynb]
      - section: Deklarieren
        contents: [projekte-nachweisen.qmd, checklist.qmd,  declaration.qmd]
      - section: Dokumentation und Referenzen
        contents: [python.qmd, dashboard.qmd, glossary.qmd, research.qmd, about.qmd]
  page-footer:
    left: "PEExcel · FH Technikum Wien · klimaaktiv Plus-Energie-Quartiere"
    right:
      - {href: about.qmd, text: Kontakt & Nutzung}
      - {href: 'https://github.com/simonschaluppe/peexcel', text: GitHub}
format:
  html:
    lang: de
    theme: cosmo
    toc: true
    lightbox: true
    code-fold: true
    css: styles.css
    include-after-body: _resize.html

comments:
  hypothesis:
    theme: clean
    openSidebar: false
