project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "tutorial_*.ipynb"
    - "!downloads/**"
    - "!assets/**"
    - "!en/**"
  # pre-render:
  #  - python ../scripts/website_assets.py
  # post-render:
  #   - python ../scripts/render_english_site.py
  resources:
    - output-catalog.js
    - illustrations/**
    - assets/**
    - media/**
    - downloads/**
    - tutorials/**
website:
  title: PEExcel
  description: Quartiere modellieren und den klimaaktiv Plus-Energie-Standard anwenden.
  search: true
  navbar:
    logo: media/logo.png
    logo-alt: "PEExcel Logo"
    left:
      - {href: excel-overview.qmd, text: Starten}
      - {href: model.qmd, text: Modellieren}
      - {href: results.qmd, text: Analysieren}
      - {href: projekte-nachweisen.qmd, text: Deklarieren}
      - {href: glossary.qmd, text: Nachschlagen}
      - {href: python.qmd, text: Python}
      - {href: assessment-explained.qmd, text: Quick-Check}
    right:
      - {href: download.qmd, text: Download, icon: download}
      - {href: en/index.html, text: English}
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: "Starten"
        contents:
          - text: "Erste Schritte"
            href: excel-overview.qmd
          - text: "Download und Voraussetzungen"
            href: download.qmd
          - text: "Orientierung im Excel-Tool"
            href: excel-navigation.qmd
          - text: "Schnellauswahl mit Presets"
            href: presets.qmd
      - section: Modellieren
        contents: [model.qmd, envelope.qmd, hvac.qmd, pv.qmd, systems.qmd, usage.qmd, interfaces.qmd, mobility.qmd, climate.qmd,components.qmd,  variants.qmd, migration.qmd]
      - section: Analysieren
        contents:
          - results.qmd
          - excel-dashboard.qmd
          - {href: flexibility.qmd, text: Flexibilität}
          - {href: mobility-analysis.qmd, text: Mobilitätsverhalten}
          - comparison.qmd
          - batch.qmd
          - examples.qmd
          - assessment-explained.qmd
      - section: Deklarieren
        contents: [projekte-nachweisen.qmd, checklist.qmd,  declaration.qmd]
      - section: "Nachschlagen"
        contents:
          - {href: glossary.qmd, text: "Begriffe, Parameter und Kennzahlen"}
          - {href: preset-catalog.qmd, text: "Preset-Katalog"}
      - section: "Python & Automatisierung"
        contents:
          - {href: python.qmd, text: "Übersicht und Einstieg"}
          - section: "Einstieg und Daten"
            contents: [tutorial_excel.ipynb, tutorial_zeitreihen.ipynb, tutorial_baubook.ipynb]
          - section: "Simulieren und analysieren"
            contents: [tutorial_batch.ipynb, tutorial_bewertung.ipynb, tutorial_stromprofile.ipynb, tutorial_netzlast.ipynb, tutorial_sankey.ipynb]
          - section: "Visualisieren und weitergeben"
            contents: [tutorial_gebaeudeschnitt.ipynb, tutorial_grafikexport.ipynb, dashboard.qmd]
          - section: "Entwicklung und Dokumentation"
            contents: [tutorial_schema.ipynb, tutorial_website.ipynb]
      - section: "Über das Projekt"
        contents:
          - research.qmd
          - {href: about.qmd, text: "Projekt, Kontakt und Nutzung"}
  page-footer:
    left: "PEExcel · FH Technikum Wien · klimaaktiv Plus-Energie-Quartiere"
    right:
      - {href: about.qmd, text: Kontakt & Nutzung}
      - {href: 'https://github.com/simonschaluppe/peexcel', text: GitHub}
format:
  html:
    lang: de
    theme: cosmo
    toc: true
    lightbox: true
    code-fold: true
    css: styles.css
    include-after-body: _resize.html

comments:
  hypothesis:
    theme: clean
    openSidebar: false
