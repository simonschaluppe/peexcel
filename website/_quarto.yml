project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "assessment.ipynb"
    - "!en/**"
  pre-render:
    - python ../scripts/website_assets.py
    - python ../scripts/publication_example.py --output assets
  post-render:
    - python ../scripts/render_english_site.py
  resources:
    - assets/**
    - media/**
    - downloads/**
    - tutorials/**
website:
  title: PEExcel
  description: Quartiere modellieren und den klimaaktiv Plus-Energie-Standard anwenden.
  search: true
  navbar:
    logo: media/logo.png
    logo-alt: "PEExcel Logo"
    left:
      - {href: index.qmd, text: Übersicht}
      - {href: start.qmd, text: Tool-Anwendung}
      - {href: model.qmd, text: Modellieren}
      - {href: results.qmd, text: Analysieren und Bewerten}
      - {href: learn.qmd, text: Dokumentation}
    right:
      - {href: download.qmd, text: Download, icon: download}
      - {href: en/index.html, text: English}
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: Tool-Anwendung
        contents: [start.qmd, presets.qmd, excel-navigation.qmd, migration.qmd, download.qmd]
      - section: Modellieren
        contents: [model.qmd, envelope.qmd, components.qmd, hvac.qmd, pv.qmd, systems.qmd, usage.qmd, interfaces.qmd, mobility.qmd, climate.qmd, variants.qmd]
      - section: Analysieren und Bewerten
        contents: [results.qmd, excel-dashboard.qmd, comparison.qmd, batch.qmd, examples.qmd, assessment-explained.qmd, declaration.qmd]
      - section: Dokumentation und Referenzen
        contents: [learn.qmd, python.qmd, assessment.ipynb, dashboard.qmd, glossary.qmd, research.qmd, about.qmd]
  page-footer:
    left: "PEExcel · FH Technikum Wien · klimaaktiv Plus-Energie-Quartiere"
    right:
      - {href: about.qmd, text: Kontakt & Nutzung}
      - {href: 'https://github.com/simonschaluppe/peexcel', text: GitHub}
format:
  html:
    lang: de
    theme: cosmo
    toc: true
    lightbox: true
    code-fold: true
    css: styles.css
    include-after-body: _resize.html
